name: deploy-backend

# Re-establishes merge→deploy for the backend after the Oct-2026 cutover off Render to the
# self-hosted Oracle VM (which has no auto-deploy). Builds on the runner (the 1 GB box OOMs
# if it builds — that crash-looped prod once), then ships the compiled dist to the box.
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  DEPLOY_HOST: 132.145.100.81      # api.leash.ink — public, not a secret
  DEPLOY_USER: ubuntu
  APP_DIR: /home/ubuntu/run

jobs:
  deploy:
    runs-on: ubuntu-latest          # x86_64, matches the box — native deps (argon2) stay compatible
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship + restart (with auto-rollback)
        run: |
          set -euo pipefail
          SSHK="ssh -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes"
          TGT="${DEPLOY_USER}@${DEPLOY_HOST}"
          remote() { $SSHK "$TGT" "$@"; }

          echo "::group::backup current build + package files (full rollback set)"
          remote "cd ${APP_DIR} && rm -rf dist.prev migrations.prev package-lock.prev package.prev; \
                  cp -r dist dist.prev; cp -r migrations migrations.prev; \
                  cp package-lock.json package-lock.prev 2>/dev/null || true; \
                  cp package.json package.prev 2>/dev/null || true"
          echo "::endgroup::"

          echo "::group::ship build + migrations"
          rsync -az --delete -e "$SSHK" backend/dist/        "${TGT}:${APP_DIR}/dist/"
          rsync -az --delete -e "$SSHK" backend/migrations/  "${TGT}:${APP_DIR}/migrations/"
          echo "::endgroup::"

          echo "::group::deps — reinstall ONLY if the lockfile changed (the 1 GB box thrashes on npm ci)"
          NEW_LOCK=$(sha256sum backend/package-lock.json | awk '{print $1}')
          OLD_LOCK=$(remote "sha256sum ${APP_DIR}/package-lock.json 2>/dev/null | awk '{print \$1}'" || echo none)
          rsync -az -e "$SSHK" backend/package.json backend/package-lock.json "${TGT}:${APP_DIR}/"
          DEPS_CHANGED=0
          if [ "$NEW_LOCK" != "$OLD_LOCK" ]; then
            DEPS_CHANGED=1
            echo "lockfile changed → npm ci --omit=dev"
            remote "cd ${APP_DIR} && npm ci --omit=dev --no-audit --no-fund"
          else
            echo "lockfile unchanged → reusing node_modules (no npm, no thrash)"
          fi
          echo "::endgroup::"

          echo "::group::restart + healthcheck (poll up to ~36s to absorb boot/settle transients)"
          remote "sudo systemctl restart leash-backend.service"
          OK=0
          for i in $(seq 1 12); do
            sleep 3
            if remote "curl -sf -o /dev/null http://localhost:8080/healthz"; then OK=1; echo "healthy after ~$((i*3))s"; break; fi
          done
          if [ "$OK" = 1 ]; then
            echo "✅ deploy complete"
            remote "cd ${APP_DIR} && rm -rf dist.prev migrations.prev package-lock.prev package.prev"
          else
            echo "❌ unhealthy after retries — rolling back to previous build"
            remote "cd ${APP_DIR} && rm -rf dist migrations; mv dist.prev dist; mv migrations.prev migrations; \
                    [ -f package-lock.prev ] && mv package-lock.prev package-lock.json; \
                    [ -f package.prev ] && mv package.prev package.json; true"
            if [ "$DEPS_CHANGED" = 1 ]; then remote "cd ${APP_DIR} && npm ci --omit=dev --no-audit --no-fund"; fi
            remote "sudo systemctl restart leash-backend.service; sleep 6"
            echo "rolled back."
            exit 1
          fi
          echo "::endgroup::"
