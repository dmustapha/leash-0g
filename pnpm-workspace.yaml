  "postcss@<8.5.18": ">=8.5.18"
  "langsmith@<0.4.37": ">=0.4.37"
  "vite@<=6.4.2": ">=6.4.3"
  "uuid@<11.1.1": ">=11.1.1"
  "decode-uri-component@<=0.4.2": ">=0.4.3"
  "stream-json@<=3.4.0": ">=3.4.1"
